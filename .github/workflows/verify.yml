name: Verify YoutubeBot

# Feature branches report through the pull request check only. Running both `push` and
# `pull_request` created two suites per commit (the branch SHA and the PR merge ref), doubling
# the cost and sometimes leaving a duplicate `verify` in progress that blocked the merge.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      TZ: America/Cuiaba
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-desktop.txt
      - name: Linux media libraries
        # The runner image already has most of these. Install only what is missing; an
        # unconditional `apt-get update` was the slow/hanging step. The EC2 mirror can
        # stall on the large ffmpeg blobs (two main timeouts on 2026-11-18), so install
        # with resume-friendly retries instead of failing on the first stall.
        run: |
          missing=""
          for package in ffmpeg libegl1 libopengl0 libxkbcommon0 libpulse0; do
            dpkg -s "$package" >/dev/null 2>&1 || missing="$missing $package"
          done
          if [ -z "$missing" ]; then
            echo "All media libraries are already present."
            exit 0
          fi
          echo "Installing missing packages:$missing"
          install_missing() {
            sudo timeout 280 apt-get install -y --no-install-recommends \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=60 $missing
          }
          install_missing \
            || { sudo timeout 120 apt-get update -qq && install_missing; } \
            || { echo "mirror still slow, one last resume attempt"; sleep 15; install_missing; }
      - name: Install test dependencies
        run: |
          npm ci
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-desktop.txt
      - name: Verify preserved and new workflows
        run: npm run verify

  desktop-crates:
    # The UI crate needs Slint's system libraries; the pure crates hold the counting rules.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - name: Rust format
        run: cargo fmt --all --check
      - name: Reports and domain tests
        run: cargo test --locked -p reports -p manager-core
