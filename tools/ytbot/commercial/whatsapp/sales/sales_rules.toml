  '(vou|irei|vamos|iremos|estou|to|estarei|ja|vo|posso) (encaminhar|encaminhando|repassar|repassando)\b.{0,35}\b(responsavel|dono|dona|proprietari[oa]|gerent[ea]|gerencia|diretor(a|ia)?|chefe|patra[oa]|soci[oa]|gestor(a)?|gestao|coordenador(a)?|supervisor(a)?|administrativ[oa]|administracao|financeiro|marketing|comercial|setor|departamento|equipe|doutor(a)?|dr\.?|dra\.?|analise|avaliacao|internamente|ele|ela|eles|elas|quem (decide|cuida|resolve))',
  '(vou|irei|vamos|iremos|estou|to|estarei|ja|vo|posso) (enviar|enviando)\b.{0,25}\b(pro|pra|para( [oa])?|ao|a) (setor |departamento |equipe )?(responsavel|dono|dona|proprietari[oa]|gerent[ea]|gerencia|diretor(a|ia)?|chefe|patra[oa]|soci[oa]|gestor(a)?|gestao|administrativ[oa]|administracao|financeiro|marketing|comercial|doutor(a)?|dr\.?|dra\.?)',
  '(irei|iremos|estarei|estou|to|ja) (passar|passando|mostrar|mostrando)\b.{0,20}\b(pro|pra|para( [oa])?|ao|a) (setor |departamento |equipe )?(responsavel|dono|dona|proprietari[oa]|gerent[ea]|gerencia|diretor(a|ia)?|chefe|patra[oa]|soci[oa]|gestor(a)?|gestao|administrativ[oa]|administracao|financeiro|marketing|comercial|doutor(a)?|dr\.?|dra\.?)',
  '\bvou (passar|mostrar)\b.{0,20}\b(pro|pra|para( [oa])?|ao|a) (setor |departamento |equipe )?(responsavel|gerencia|diretoria|marketing|financeiro|administrativ[oa]|administracao|setor|departamento)\b',
  '\b(encaminhei|encaminho|encaminhando|encaminhado|encaminharemos|repassei|repasso|repassando|repassado|repassaremos)\b.{0,35}\b(responsavel|dono|dona|proprietari[oa]|gerent[ea]|gerencia|diretor(a|ia)?|chefe|patra[oa]|soci[oa]|gestor(a)?|gestao|coordenador(a)?|supervisor(a)?|administrativ[oa]|administracao|financeiro|marketing|comercial|setor|departamento|equipe|doutor(a)?|dr\.?|dra\.?|analise|avaliacao|internamente|ele|ela|eles|elas|quem (decide|cuida|resolve))',
  '\b(passei|enviei)\b.{0,20}\b(pro|pra|para( [oa])?|ao|a) (setor |departamento |equipe )?(responsavel|dono|dona|proprietari[oa]|gerent[ea]|gerencia|diretor(a|ia)?|chefe|patra[oa]|soci[oa]|gestor(a)?|gestao|administrativ[oa]|administracao|financeiro|marketing|comercial|doutor(a)?|dr\.?|dra\.?)',
  '\b(vou|irei|vamos|iremos|estou|to|estarei) (encaminhar|encaminhando|repassar|repassando)( (a |essa |sua |as )?(mensagem|proposta|informac\w*|contato|exemplos?|links?))?[!. ]*$',
  '^(ja )?(encaminhei|encaminhado|encaminhando|repassei|repassado)( aqui| agora| sim)?[!. ]*$',
]
messages = [
  "Entendido, muito obrigado! Fico no aguardo do retorno.",
]

[[intents]]
id = "gatekeeper"
