  'chama o alexandre',
]
messages = ["Claro! Já continuo com você pessoalmente."]

[[intents]]
id = "bot_question"
action = "reply"
fixed = true
when = "Pergunta se é robô, bot, IA, mensagem automática ou se está falando com uma pessoa."
patterns = [
  '\brobo\b', '\bbot\b', '\be (uma )?ia\b', 'inteligencia artificial', '\bchatgpt\b', '\bautomatic[oa]\b',
  '(e|eh) (uma )?pessoa', 'falando com (uma )?pessoa', 'e gente de verdade', 'e humano',
]
messages = [
  "Essas mensagens são enviadas com ajuda de um assistente automático meu, mas eu acompanho todas as conversas e respondo pessoalmente quando precisa. Se preferir, é só pedir que eu mesmo continuo com você.",
]

[[intents]]
id = "how_got_number"
action = "reply"
fixed = true
when = "Pergunta como conseguiu o número, onde achou o contato ou quem passou."
patterns = [
  'como (voce |vc |vcs )?(conseguiu|achou|pegou|encontrou|teve)', 'onde (voce |vc )?(pegou|achou|conseguiu|encontrou)',
  'quem (te )?passou', 'de onde (voce |vc )?(tirou|pegou)',
]
messages = [
  "Encontrei a empresa de vocês no Google Maps; o número está no perfil público de vocês. Se preferir não receber mensagens, é só me avisar que não entro mais em contato.",
]

[[intents]]
id = "trust_concern"
action = "handoff"
fixed = true
priority = "needed"
reason = "Desconfiança: precisa de contato pessoal"
when = "Acha que é golpe, fraude ou pergunta se é confiável ou seguro."
patterns = ['golpe', 'fraude', 'e confiavel', 'e seguro', 'desconfi', 'como (eu )?(sei|vou saber) que', 'e verdade isso']
messages = ["Entendo a desconfiança, é bom ter cuidado! Já te respondo pessoalmente."]

[[intents]]
id = "links_not_opening"
action = "reply"
fixed = true
when = "Diz que não consegue abrir, ver ou clicar nos links ou exemplos ('não estou conseguindo abrir o link', 'os sites não abrem', 'o link não funciona'). O WhatsApp bloqueia links de números que não estão salvos na agenda."
patterns = [
  'nao (estou |to |tou |esta |ta )?(consigo|consegui|conseguindo|da pra|deu pra|abre|abriu|abrem|abrindo|carrega|carregou|carregando|funciona|funcionou|aparece|apareceu)[^.?!]{0,30}(abrir|acessar|entrar|ver|clicar|link|site|exemplo)',
  '(link|links|site|sites|exemplo|exemplos)[^.?!]{0,40}nao (abre|abrem|abriu|abriram|carrega|carregam|funciona|funcionam|aparece|aparecem|esta abrindo|estao abrindo|clica)',
  '(link|links)[^.?!]{0,20}(bloquead|desativad|travad)',
]
messages = [
  "Ah, isso é normal! Por segurança, o WhatsApp não deixa abrir links enviados por um número que ainda não está salvo na agenda.",
  "Se você salvar meu contato (Alexandre, da Zaflas Inova Simples), os links passam a abrir normalmente: é só tocar neles de novo.",
  "Se preferir, também dá para copiar o endereço, como zaflas.com.br, e colar no navegador do celular.",
]

[[intents]]
id = "who_are_you"
action = "reply"
fixed = false
when = "Pergunta quem é, quem fala, de qual empresa, o que a empresa faz."
patterns = ['quem (e|eh|fala|esta falando)', 'qual (e a )?empresa', 'quem seria', '^quem\??$', 'o que (voces|vcs) fazem']
messages = [
  "Sou o Alexandre, da Zaflas Inova Simples. A gente cria sites, sistemas e aplicativos para empresas.",
]

[[intents]]
id = "call_request"
