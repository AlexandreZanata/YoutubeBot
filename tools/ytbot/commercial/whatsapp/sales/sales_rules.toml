fixed = true
priority = "hot"
reason = "Fechou o site institucional: chaves Pix enviadas, confirme a entrada"
when = "Uso interno: quer fechar só o site institucional (a conversa é sobre o site de apresentação, não sobre sistema ou aplicativo)."
patterns = []
messages = [
  "Que ótimo! Para começarmos o seu site institucional, a entrada é de R$ 250. Pode fazer o Pix para uma destas chaves:",
