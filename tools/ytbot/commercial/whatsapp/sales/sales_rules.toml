action = "handoff"
fixed = true
priority = "hot"
reason = "Diz que pagou a entrada: confira o Pix e confirme"
when = "Diz que pagou, fez o Pix ou manda o comprovante."
patterns = [
  '\bpaguei\b', 'fiz o (pix|pagamento)', 'pix (feito|enviado|realizado|pago)', 'comprovante', '\btransferi\b',
