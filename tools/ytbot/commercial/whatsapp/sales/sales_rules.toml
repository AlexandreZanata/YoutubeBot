  'deixa eu ver com (o|a)', 'preciso ver com (o|a)', 'tenho que ver com (o|a)', 'nao sou eu que (decido|cuido)',
  'vou (ver|falar|conversar) com (o|a) (dono|dona|responsavel|chefe|gerente|patra[oa]|doutor|doutora|dr\.?|dra\.?)', '(ele|ela) (te )?(chama|retorna|liga|responde)',
]
messages = [
  "Muito obrigado pelo retorno!",
  "Você poderia me passar o contato de quem cuida das decisões sobre site e divulgação da empresa? Assim eu falo direto com a pessoa e não tomo o seu tempo.",
]

[[intents]]
id = "negotiation"
action = "handoff"
fixed = true
priority = "needed"
reason = "Negociação de preço ou pagamento"
when = "Negocia valor ou condição: achou caro, pede desconto, oferece outro valor, quer parcelar ou começar sem entrada."
patterns = [
