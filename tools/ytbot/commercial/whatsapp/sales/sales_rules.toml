# Zaflas Inova Simples WhatsApp sales rules.
#
# Contract: docs/COMMERCIAL-WHATSAPP-SALES.md. This file is the only source of prices,
# deadlines, links and promises. The model (OpenCode Go, deepseek-v4.1-flash) receives it as
# context and every reply is checked against it: a money value, duration, percentage, link or
# forbidden term that is not written here makes the reply fall back to the fixed text below or
# go to the owner. Message texts are Brazilian Portuguese; comments stay in English.
#
# Patterns are Python regular expressions matched against the incoming text after lowercasing,
# removing accents and collapsing spaces ("Não, obrigado!" -> "nao, obrigado!").

version = 1
company = "Zaflas Inova Simples"
agent_name = "Alexandre"
language = "pt-BR"
timezone = "America/Cuiaba"

[limits]
daily_openings = 50
auto_conversation = false            # owner 2026-11-20: openings only; the owner takes every
                                     # conversation. false = no bot replies, no follow-ups                 # owner decision 2026-11-19 (was 30 earlier today, 10 on 2026-11-17)
max_replies_per_lead_per_day = 12   # stops loops with other bots; the owner takes over
max_bot_replies_before_owner = 8    # a long chat that has not reached a quote goes to the owner
owner_reminder_minutes = 30         # new messages in a chat that is with the owner: one reminder
max_messages_per_reply = 4          # links in their own messages do not count
max_message_chars = 600
followup_after_hours = 72           # one follow-up when the opening got no answer
max_followups = 1
no_response_after_followup_hours = 96

[hours]
# Weekday numbers: 0 = Monday ... 6 = Sunday. Times are local (America/Cuiaba).
opening_days = [0, 1, 2, 3, 4]
opening_start = "07:00"
opening_end = "17:00"
# People who wrote are answered in this window; later messages wait for the next window.
reply_days = [0, 1, 2, 3, 4, 5, 6]
reply_start = "07:00"
reply_end = "17:00"

[pacing]
# Interval between two messages of a reply = typing time of the message (+ reading time of the
# received one before the first message), clamped and jittered. The interval includes the
# typing itself. Calibrated on the owner's opening (8 s for ~150 characters), 2026-11-17.
typing_chars_per_second = 20.0
min_seconds = 2.0
max_seconds = 10.0
reading_chars_per_second = 40.0
reading_min_seconds = 1.0
reading_max_seconds = 4.0
jitter = 0.15
link_preview_seconds = 3.0          # minimum wait after typing a link, for the preview card
between_chats_min_seconds = 10.0
between_chats_max_seconds = 30.0
# Owner decision 2026-11-20: after a 24h WhatsApp restriction caused by incongruous
# automated conversations, the bot sends the opening only, 5 minutes apart, and never
# answers: every reply goes straight to the owner (needs-owner + notification).
between_openings_min_seconds = 300.0
between_openings_max_seconds = 330.0
max_typing_wait_seconds = 60.0      # safety cap while waiting for a contact in "digitando..." state
reply_debounce_seconds = 30.0       # owner 2026-11-19: wait this long after the last incoming
                                    # bubble before answering, so a person splitting a thought
                                    # into two or three messages is read naturally

[llm]
# Owner decision 2026-11-17 (evening): OpenCode Go free models first, in rotation, then the
# paid fallback. A model is free when the live catalog lists it with price 0 (longcat-2.5-free,
# hy4-flash-free, beam-free, iceman-contributor-free on 2026-11-17; new free models are used
# automatically). The code accepts no other paid model than the two below.
base_url = "https://opencode.ai/inference/go/openai/v1"
models_url = "https://opencode.ai/inference/go/v1/models"
api_key_env = "OPENCODE_GO_API_KEY"
fallback = ["deepseek-v4.1-flash", "muse-spark-1.3-contributor"]
exclude = []                        # free models never to use (e.g. ones that train on prompts)
temperature = 0.3
max_output_tokens = 4096            # includes reasoning tokens
free_timeout_seconds = 20           # a free model that does not answer in time is skipped
timeout_seconds = 90                # paid fallback
probe_timeout_seconds = 8           # parallel health check of every free model
quick_timeout_seconds = 8           # small optional lookups (a name in a message) per model
quick_attempts = 2                  # models tried for such a lookup before the local fallback
long_timeout_seconds = 45           # the client ficha (large JSON after reasoning) on free models
long_max_output_tokens = 8192       # the client ficha: room for reasoning plus the JSON
long_race = 4                       # free models asked at once for the ficha; the first JSON wins
long_reasoning_effort = "low"       # the ficha needs little reasoning (40 s -> 11 s on beam-free)
cooldown_seconds = 120              # pause after a timeout or an error
no_credit_cooldown_seconds = 1800   # pause after "no credits" / rate limit (402, 429, quota)
catalog_refresh_seconds = 3600      # re-read the catalog (and probe) every hour

[greetings]
morning = "Bom dia"        # before 12:00
afternoon = "Boa tarde"    # 12:00 to 17:59
evening = "Boa noite"      # from 18:00

[opening]
# Sent once per number, one message per bubble, in this order. Never repeated.
# `delays` is the owner's interval in seconds before each message (greeting 4 s, "Tudo bem?"
# 2 s, introduction 8 s, examples 8 s); each link waits `link_delay` (owner, 2026-11-17).
delays = [4, 2, 8, 8]
link_delay = 4
messages = [
  "{greeting}",
  "Tudo bem?",
  "Sou o Alexandre da empresa Zaflas Inova Simples, nossa empresa cria sistemas, sites e aplicativos. Eu vi que no Google Maps a empresa {company} ainda não tem site.",
  "Nós temos um catálogo completo com exemplos de sistemas e sites que nós criamos:",
]
# {company} is the business name exactly as on Google Maps (the lead `name`, spaces
# normalized, at most `company_max_chars`, cut at a word). Without a name, `unnamed` replaces
# that message (owner, 2026-11-18). The opening is fixed text: the model never writes it.
unnamed = "Sou o Alexandre da empresa Zaflas Inova Simples, nossa empresa cria sistemas, sites e aplicativos. Eu vi que no Google Maps vocês não têm site."
company_max_chars = 120
# Each link goes in its own message so WhatsApp loads the preview card.
# Owner 2026-11-22: only the catalog site; it holds the complete portfolio.
links = [
  "https://comerc.app.br",
]

[referral_ask]
# Owner 2026-11-19: after a soft "no", ask for an indication in small bubbles.
# Not wired to the refusal intent yet: a refusal is a permanent do-not-contact entry
# (see docs/COMMERCIAL-WHATSAPP-SALES.md), so sending after one needs the owner's
# explicit override. Never sent as a single wall of text.
enabled = true
messages = [
  "Aproveitando o contato, queria te pedir uma gentileza.",
  "Caso conheça algum empresário ou alguém que esteja precisando de um site, sistema ou aplicativo, ficaria muito agradecido se pudesse indicar nosso trabalho.",
  "Também podemos desenvolver exemplos e demonstrações gratuitas, sem compromisso, para que a pessoa possa conhecer melhor nossas soluções e visualizar como poderíamos ajudar seu negócio antes de contratar qualquer serviço.",
  "Estamos buscando novas oportunidades e acredito que uma boa indicação pode fazer toda a diferença.",
  "Desde já, muito obrigado pela atenção e pela força! Um grande abraço!",
]

[followup]
messages = [
  "Oi, tudo bem? Só passando para saber se você conseguiu ver os exemplos que te mandei. Se tiver interesse em um site ou sistema, é só me falar.",
]

[facts]
empresa = [
  "Quem fala é o Alexandre, da Zaflas Inova Simples, que cria sistemas, sites e aplicativos.",
  "O contato da empresa veio do perfil público dela no Google Maps, que não mostra site.",
  "As mensagens são enviadas com ajuda de um assistente automático do Alexandre; ele acompanha todas as conversas e responde pessoalmente quando precisa.",
  "Nosso catálogo com todos os exemplos de sites e sistemas: https://comerc.app.br.",
]
site_institucional = [
  "Site institucional é o site de apresentação da empresa: estático, só visual, como uma vitrine na internet com quem são, serviços, fotos, endereço, horário e um botão para chamar no WhatsApp.",
  "Ele não tem login, cadastro, agendamento nem pagamento online; por isso é mais simples e mais barato.",
  "Os valores a seguir valem SOMENTE para o site institucional.",
  "Valor médio do site institucional: R$ 500, com entrada de R$ 250.",
  "Prazo médio de entrega do site institucional: 15 dias.",
  "Servidor do site institucional, que o mantém no ar: R$ 39,90 por mês no boleto ou Pix, ou R$ 45 por mês no cartão.",
  "Para fechar o site institucional, a entrada é paga por Pix nas chaves que o bot envia; a construção começa depois do pagamento da entrada.",
]
dominio = [
  "O domínio é o endereço do site na internet: aquele nome que a pessoa digita para entrar, como suaempresa.com.br (é como a placa e o endereço da empresa na internet). Ele é separado da criação do site.",
  "No site oficial https://registro.br/ o cliente pode digitar ideias de nomes e testar na hora se estão livres para registro.",
  "Para ter o domínio, o cliente pode escolher entre 3 opções: 1) comprar manualmente por conta própria no https://registro.br/; 2) comprar manualmente lá e depois nós ajudamos a configurar tudo no site; ou 3) deixar que nós compramos e configuramos o domínio para ele, com um valor adicional de R$ 40 na primeira mensalidade referente ao domínio de 1 ano.",
]
sistemas = [
  "Aplicativos e sistemas NÃO custam R$ 500 e não seguem nenhum valor do site institucional.",
  "Cada aplicativo ou sistema é feito sob medida: valor e prazo dependem das funções e dos requisitos do cliente (login, cadastro, agendamento, pagamentos, estoque, painel, área do cliente, integrações).",
  "Por isso aplicativos e sistemas sempre passam por um orçamento, que o Alexandre faz pessoalmente.",
  "Pedidos incomuns ou plataformas personalizadas (cassino, apostas, rifa, marketplace, rede social, portal ou qualquer projeto fora do site institucional simples) entram direto na entrevista de requisitos para entender exatamente como o sistema funcionaria, sem passar valor de site institucional e sem prometer viabilidade antes do orçamento.",
]

[guard]
# A sentence with a money value or a number of days may talk about apps or systems only when it
# also says "institucional": the site prices must never look like an app price (owner,
# 2026-11-17).
system_words = [
  'aplicativo', '\bapps?\b', 'sistema', 'loja (virtual|online)', 'e-?commerce', 'agendamento',
  '\bcadastro', '\blogin\b', '\bpainel\b', 'area do cliente',
  'cassino', 'tigrinho', 'aposta', '\bbets?\b', '\brifas?\b', 'sorteio', 'plataforma',
  'marketplace', 'rede social', 'leilao', 'streaming', 'area de membros', '\bsaas\b',
  '\berp\b', '\bcrm\b', '\bpdv\b',
]
# Terms the model may never write (checked after removing accents).
forbidden = [
  "desconto", "gratis", "gratuito", "de graca", "garantimos", "garantido", "garantia",
  "promocao", "sem juros", "parcelamos", "parcelado", "chave pix", "pix copia", "senha",
  "cpf", "cnpj", "cartao de credito numero", "100%",
]
# The model may never deny being automated.
human_claims = [
  'sou (um |uma )?(humano|pessoa de verdade|pessoa real)',
  'nao sou (um |uma )?(robo|bot|ia|assistente)',
]
# A reply that asks "Você gostaria que eu fizesse um orçamento?" may not also say the quote
# will be made: that answers its own question (owner review, 2026-11-17).
quote_promises = [
  '(faco|farei|vou fazer|faremos|preparo|vou preparar|monto|vou montar|mando|vou mandar|envio|vou enviar|te passo) (o |um |seu )?orcamento',
  'entao (eu )?faco',
]

[brief]
# After the client accepts the quote the bot collects the project details, then writes the
# client folder (ficha.md, ficha.json, conversa.md, midia/) and hands the quote to the owner.
# It asks for at most two missing items per message and stops after `max_collect_turns`
# answers or when the client says it is done.
max_collect_turns = 6
required = [
  "nome da empresa e o que ela faz",
  "o que o site deve mostrar (principais serviços, produtos ou informações)",
  "dados de atendimento para o site (endereço ou cidade, dias e horários de funcionamento, WhatsApp do botão e Instagram ou redes sociais)",
  "cores principais da marca e estilo visual desejado (ex.: mais limpo e moderno, mais sério e tradicional, mais elegante ou mais colorido, fundo claro ou escuro)",
  "domínio desejado (endereço .com.br) e como prefere fazer (comprar manualmente, comprar manualmente e ajudarmos a configurar, ou deixarmos comprar por +R$ 40 na primeira mensalidade para o domínio de 1 ano)",
]
optional = [
  "logotipo da empresa (se já tiver)",
  "fotos do local, da equipe ou dos serviços e produtos",
  "algum site ou página que acha bonito como inspiração",
]
domain_messages = [
  "Agora sobre o domínio! Explicando de um jeito bem simples: o domínio é o endereço do seu site na internet, aquele nome que a pessoa digita para entrar, como suaempresa.com.br (como se fosse o endereço da sua loja na internet). Neste site oficial você consegue digitar ideias de nomes e testar na hora se estão livres:",
  "https://registro.br/",
  "Para ter esse endereço, você pode escolher como prefere: 1) comprar manualmente por conta própria lá no site; 2) comprar manualmente lá e depois nós te ajudamos a configurar tudo no site; ou 3) deixar que nós compramos e cuidamos de tudo para você, com um valor adicional de R$ 40 na primeira mensalidade referente ao domínio de 1 ano.",
  "Você já pensou em algum nome para o endereço do site e qual dessas opções prefere?",
]
done_patterns = [
  '\be isso\b', '\bso isso\b', '\bisso a[ie]\b', '\biss[ao]e\b', 'mandei tudo',
  'pode (fazer|montar|mandar) o orcamento', 'por enquanto e isso',
  'acho que e isso', 'ta bom assim', 'era isso', '^pode fazer[.! ]*$',
  '^(obrigad[oa]|valeu|ok|blz|beleza|fechou|show|top|joia|positivo|afirmativo|confirmado|confirmo|combinado|perfeito|tudo certo|ta certo|esta certo|tudo ok|ta ok|pode seguir|manda ver)[!. ]*$',
]
fallback_question = "Anotei! Para completar sua ficha, pode me contar também o endereço e horário de atendimento, as cores principais da sua marca, o estilo que você imagina para o site (mais moderno, tradicional, claro ou escuro) e mandar a logo ou fotos se tiver. Quando terminar, é só me avisar."

[brief_system]
# Apps and systems (owner, 2026-11-18): the bot does not hand the chat over as soon as the
# client wants something beyond the institutional site. It interviews the client gently, one
# or two simple questions at a time, restating what it understood, until the requirements
# below are clear; then it shows the client a summary to confirm and hands the complete ficha
# to the owner (quote-requested, or buying when the client already wants to close).
max_collect_turns = 10
max_confirmations = 2
required = [
  "nome da empresa e o que ela faz",
  "qual problema do dia a dia o sistema ou aplicativo deve resolver (o objetivo principal)",
  "quem vai usar (clientes, funcionários ou só o dono) e mais ou menos quantas pessoas",
  "as principais funções que precisa ter (por exemplo agendamento, cadastro de clientes, pedidos, estoque, pagamentos, relatórios)",
  "como isso é feito hoje, se já existir (caderno, planilha, WhatsApp, outro sistema ou projeto novo)",
  "onde vai usar: aplicativo de celular, sistema no navegador do computador, ou os dois",
  "se precisa se ligar a algo que já usa (Pix ou pagamento online, nota fiscal, WhatsApp ou outro sistema)",
]
optional = [
  "algum aplicativo ou sistema que usa ou acha bom como exemplo",
  "se existe uma data importante para começar a usar",
  "logotipo e cores da marca, se já tiver",
]
start = [
  "Ótimo! Para eu entender direitinho o que você precisa e o orçamento sair certo, vou te fazer algumas perguntas rápidas, uma ou duas por vez. Se preferir, pode responder por áudio.",
]
start_buy = [
  "Que ótimo! Para eu preparar a proposta certinha, preciso entender alguns detalhes do sistema antes. Vou te fazer algumas perguntas rápidas, uma ou duas por vez. Se preferir, pode responder por áudio.",
]
start_custom = [
  "Para projetos personalizados assim, a gente avalia tudo sob medida para ver como montar e calcular o orçamento certinho. Vou te fazer algumas perguntas rápidas, uma ou duas por vez (se preferir, pode responder por áudio).",
]
first_question = "Para começar: qual é o nome da empresa e qual problema do dia a dia você quer resolver com esse sistema ou aplicativo?"
first_question_custom = "Para eu entender direitinho: como exatamente você imagina esse sistema funcionando na prática e o que as pessoas precisam conseguir fazer nele?"
fallback_question = "Anotei! Me conta um pouco mais: quem vai usar no dia a dia e quais são as principais coisas que ele precisa fazer?"
confirm_intro = "Deixa eu confirmar se entendi tudo certinho:"
confirm_question = "Está certo? Se quiser ajustar ou acrescentar alguma coisa, é só me falar."
done_messages = ["Perfeito, anotei tudo! Com essas informações eu preparo o orçamento do seu sistema e te mando por aqui."]
done_messages_buy = ["Perfeito, anotei tudo! Já te respondo pessoalmente com a proposta e os próximos passos."]

[referral]
# A staff member who does not decide is asked, politely, for the decision maker's contact.
# Names never take an article ("a Felipe", "da Barbearia" may be the wrong gender): write
# "da empresa {company}" and people's names alone ("Vou falar com {who}").
# A number sent in the chat becomes a new lead (same category, next number, vCard) and gets
# its own opening, mentioning who passed the number. Staff chats then stop (state referred).
ask_name = "E com quem eu falo, por gentileza?"
ask_contact_again = "Prazer, {staff}! Você poderia me passar o contato de quem cuida das decisões sobre site e divulgação da empresa?"
gave_up = "Sem problema! Fico à disposição: se a pessoa responsável quiser conversar, é só me chamar por aqui. Obrigado!"
thanks = "Muito obrigado, {staff}! Vou falar com {who} agora."
thanks_unnamed = "Muito obrigado! Vou falar com {who} agora."
who_unnamed = "a pessoa responsável"
daily_limit = 10                    # referral openings, apart from the cold ones
opening = [
  "{greeting}",
  "Tudo bem?",
  "{staff}, da empresa {company}, me passou o seu contato. Sou o Alexandre, da Zaflas Inova Simples: criamos sistemas, sites e aplicativos. Vi que no Google Maps a empresa {company} ainda não tem site.",
  "Nós temos alguns exemplos de sistemas e sites que nós criamos:",
]
opening_unnamed = "A equipe da empresa {company} me passou o seu contato. Sou o Alexandre, da Zaflas Inova Simples: criamos sistemas, sites e aplicativos. Vi que no Google Maps a empresa {company} ainda não tem site."
contact_card = "Mandou o contato do responsável em cartão: salve o número e chame"

[context]
# Short answers are read against the last question we asked. After the offer question, an
# affirmative answer is `quote_accept` and a negative one is `refusal`. While the lead is in
# `qualifying`, any other text is `quote_details`.
offer_question = 'orcamento\?'
affirmative = [
  '^(sim+|ss+|s|quero|queremos|pode|pode sim|pode ser|pode fazer|pode mandar|claro|com certeza|com ctz|ctz|gostaria|gostaria sim|bora|vamos|vamos sim|vamos la|manda|manda ver|manda ai|faz|faz sim|faca|isso|isso a[ie]|iss[ao]e|e isso|aceito|por favor|pfv|ok,? pode|ok,? quero|quero sim|fechou|beleza|blz|show|top|positivo|opa,? (pode|quero|sim|bora))\b',
]
negative = ['^(nao|n|nop|negativo)\b']

[handoff]
# Sent once when the model asks for the owner on an ordinary intent, so the contact is not left
# waiting. Dedicated hand-off intents below carry their own text, priority and reason.
messages = ["Certo! Vou verificar direitinho e já te respondo."]

# Intents. `action` decides what happens after the messages:
#   reply   send the messages and keep the conversation going
#   qualify send the messages and wait for the project details (state qualifying)
#   quote   send the messages, then the owner prepares the quote (state quote-requested)
#   collect gather the project details for the client folder, then hand the quote over
#   close   send the messages and stop without follow-up (state closed)
#   block   send the fixed messages, then never contact again (do-not-contact list)
#   handoff send the messages, then the owner answers (state needs-owner)
#   ignore  send nothing
# Hand-off intents (`handoff`, `quote`) also carry `priority` and `reason` for the owner's
# notification: hot = buying signal, answer within minutes; needed = the bot lacks the
# information or the authority; alert = something went wrong.
# `fixed = true` sends the messages verbatim; otherwise the model may reword them using only
# the facts above. Order matters for the local classifier: the first matching pattern wins.

[[intents]]
id = "opt_out"
action = "block"
fixed = true
when = "Pede para parar, remover o número, diz que é spam, ameaça denunciar ou bloquear."
patterns = [
  'para de (me )?(mandar|enviar)', 'pare de', 'nao (me )?(mande|mandem|envie)', 'remov[ae] (meu|o meu|esse) (numero|contato)',
  '(me )?remov[ae]( (da|de)( minha)? lista)?( por favor| pfv)?[.! ]*$',
  '(meu|o meu|esse) (numero|contato).{0,15}(remov[ae]|apag[ae]|tira|retira|exclu[ai])',
  '(tira|retira|apaga|exclui|exclua)\s*(o\s+meu|meu|o|esse)?\s*(numero|contato)(\s+da\s+lista)?(\s+dai)?',
  '(pode|por favor|pfv)?\s*(tirar|remover|apagar|retirar)\s*(o\s+meu|meu|o|esse)?\s*(numero|contato)(\s+da\s+lista)?',
  '\bspam\b', 'denunci', '\bbloque(ar|ia|ei|io)\b', 'nao (me )?(chame|chama|procure|incomode) mais',
  'nao (me )?(chame|chama|procure|incomode)[.! ]*$', 'sai fora',
]
messages = ["Desculpe o incômodo! Não vou mais entrar em contato. Obrigado pela atenção."]

[[intents]]
id = "refusal"
action = "ask_referral"
fixed = true
reason = "Recusou: pedido de indicação enviado"
when = "Recusa: 'nesse momento não estou precisando', 'não, obrigado', 'agora não', 'não tenho interesse', 'não preciso', ou 'não' em resposta à oferta de orçamento. 'Agora não posso, me chama amanhã' NÃO é recusa (é callback_later)."
patterns = [
  'nao,? obrigad', 'nao (estou|to|estamos|tamo|tamos) precisando', 'nao (preciso|precisamos)( de site| disso| nao)?[,.! ]*(obrigad[oa])?[.!]*$',
  'nao (tenho|temos) interesse', 'sem interesse', 'nao (quero|queremos)( nao)?[,.! ]*(obrigad[oa])?[.!]*$',
  '^agora nao[,.! ]*(obrigad[oa]|valeu)?[.!]*$', 'agora nao,? (obrigad|valeu|preciso|quero)',
  'n(esse|este|o) momento nao (estou |to |estamos )?(precis|quero|tenho interesse|temos interesse)',
  'nao me interessa', '\bdispens[aei]\w*\b(?!\s+(um\s+|uma\s+|a\s+|o\s+)?(funcionari|colaborador|advogad|gerent|empregad|pessoa|motorista|secretari))|\bdispenc[oa]\w*\b', 'obrigad[oa]( (pelo|pela) (contato|atencao|retorno|mensagem|link|exemplo))?,? mas nao', 'no momento nao[,.! ]*(obrigad[oa])?[.! ]*$', 'deixa(r|ndo|rei)? pra la\b', 'sem (dinheiro|grana|verba) agora[,.! ]*(obrigad[oa])?', 'nao,? valeu', 'nao e (do nosso|o nosso) interesse',
]
messages = []

[[intents]]
id = "auto_reply"
action = "ignore"
fixed = true
when = "Resposta automática de WhatsApp Business: saudação de ausência, horário de atendimento, 'em breve retornaremos', menu numérico."
patterns = [
  'esta e uma (mensagem|resposta) automatica', 'obrigad[oa] (por|pelo) (entrar em )?contato',
  'retornaremos', 'em breve (responderemos|retornaremos|entraremos|nossa equipe)',
  'assim que possivel (responderemos|retornaremos|entraremos)', 'nossa equipe (ira |vai )?(responder|retornar|atender)',
  'nosso horario de atendimento', 'atendimento (automatico|eletronico)',
  'digite (o numero|1|uma opcao)', 'selecione uma (das )?opco',
