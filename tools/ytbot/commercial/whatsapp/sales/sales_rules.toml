]
messages = ["Recebido, obrigado! Vou conferir e já te confirmo por aqui."]

[[intents]]
id = "referral"
action = "refer"
fixed = true
priority = "hot"
reason = "Indicou outro número para falar"
when = "Manda o número de outra pessoa para conversar (o dono, o gerente ou o responsável)."
patterns = ['(?<!\d)(\+?55[\s.-]*)?\(?\d{2}\)?[\s.-]*9?[\s.-]*\d{4}[\s.-]*\d{4}(?!\d)']
messages = ["Muito obrigado! Vou falar com a pessoa responsável agora."]

