  'nao sou (o |a )?(dono|dona|responsavel|proprietari)',
  '(o|a) (dono|dona|responsavel|proprietari[oa]|gerente|chefe|patra[oa]|doutor|doutora|dr\.?|dra\.?) (nao esta|nao ta|nao se encontra|esta ocupad|ta ocupad|esta em atendimento|ta em atendimento|que (decide|ve|cuida|resolve))',
