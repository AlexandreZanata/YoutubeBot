patterns = ['^\[?(audio|voice message|mensagem de voz|ptt)\]?$', '^\W*\d{1,2}:\d{2}$']
messages = [
  "Recebi seu áudio! Agora não consigo ouvir, consegue me mandar por escrito? Se não der, eu ouço assim que puder e te respondo.",
]

[[intents]]
id = "sticker"
