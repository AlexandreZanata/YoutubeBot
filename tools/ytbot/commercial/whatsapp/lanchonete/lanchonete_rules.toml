# Intents. `action` decides what happens after the messages:
#   reply   send the messages and keep the conversation going
#   menu    send the generated menu
#   handoff send the messages, then the owner answers
#   close   send the messages and stop until the customer writes again
#   cancel  cancel the order being assembled (the agent checks the order state)
#   block   send the fixed messages, then never contact again (do-not-contact list)
#   ignore  record the message and send nothing

[[intents]]
id = "opt_out"
action = "block"
fixed = true
when = "A pessoa pede para parar de receber mensagens, chama de spam ou ameaça denunciar."
priority = "alert"
reason = "Pediu para parar de receber mensagens"
patterns = [
  'para de (me )?mandar', 'nao quero (mais )?(receber|mensagens)', 'me (tira|remove) da lista',
  'nao me mande mais', 'spam', 'bloque(ar|eio)', 'vou denunciar', 'pare de enviar',
]
messages = [
  "Entendi. Vou parar de te enviar mensagens por aqui. Obrigado pelo contato!",
]

[[intents]]
id = "bot_question"
action = "reply"
fixed = true
when = "A pessoa pergunta se é robô, bot, IA ou atendimento automático."
priority = "needed"
patterns = [
  'voce e (um |uma )?(robo|bot|ia|assistente)', 'e (um |uma )?(robo|bot|ia)',
  'atendimento (e )?automatico', 'isso e (um )?(robo|bot|ia)', 'falo com (um )?robo',
  'tem (alguem|gente) ai',
]
messages = [
  "Sou a assistente virtual da {company}. O atendente acompanha as conversas e assume quando precisa. 😊",
]

[[intents]]
id = "human_request"
action = "handoff"
fixed = true
when = "A pessoa pede para falar com o atendente, responsável, gerente ou uma pessoa."
priority = "hot"
reason = "Cliente pediu para falar com uma pessoa"
patterns = [
  'falar com (um |o |a )?(atendente|humano|pessoa|responsavel|dono|gerente|atendimento)',
  'quero (um |o )?atendente', 'quero pedir (o |a |um |uma )?atendente',
  'pedir (o |a |um |uma )?atendente', 'atendimento humano',
  'chama (o )?(atendente|responsavel|gerente)',
  'quero falar com alguem', 'me passa para (um |o )?(atendente|responsavel)',
]
messages = ["Claro! Vou passar sua conversa para um atendente humano agora e ele já te responde por aqui. Obrigado por aguardar! 😊"]

[[intents]]
id = "complaint"
action = "handoff"
fixed = true
when = "A pessoa reclama de pedido errado, faltando item, frio, atrasado ou quer reembolso."
priority = "hot"
reason = "Reclamação de pedido"
patterns = [
  'pedido (errado|incompleto|frio|veio errado|veio frio)', 'faltou (um|uma|o|a|um item)',
  'veio (errado|frio|sem)', 'reclama', 'pessimo', 'horrivel', 'quero (meu )?dinheiro de volta',
  'quero reembolso', 'nao chegou (o )?pedido',
]
messages = ["Sinto muito por isso! Vou chamar o responsável agora para resolver com você."]

[[intents]]
id = "status"
action = "handoff"
fixed = true
when = "A pessoa pergunta do pedido já confirmado: se saiu, se chegou, quanto falta ou reclama de atraso."
priority = "hot"
reason = "Cliente quer saber do pedido confirmado"
patterns = [
  'cade (o )?(meu )?pedido', 'meu pedido (ja )?(saiu|chegou|esta pronto|foi)',
  'quanto tempo (para|falta|demora)', 'atras(ou|ado)', 'ja mandou (o )?pedido',
  'o pedido (ja )?(saiu|chegou)',
]
messages = ["Vou confirmar com a cozinha e já te respondo por aqui."]

[[intents]]
id = "cancel"
action = "cancel"
fixed = true
when = "A pessoa cancela o pedido que está sendo montado ou já confirmado."
priority = "needed"
patterns = [
  'cancela(r)? (o |meu )?pedido', 'desisti do pedido', 'nao quero mais (o )?pedido',
  'pode cancelar', 'deixa pra (outra|depois)',
]
messages = ["Pedido cancelado. Se quiser começar de novo, é só me chamar. 😊"]

[[intents]]
id = "menu"
action = "menu"
fixed = true
when = "A pessoa pede o cardápio, o menu ou pergunta o que a lanchonete tem."
priority = "needed"
patterns = [
  'cardapio', 'menu', 'o que (voces )?(tem|vende|oferece)', 'quais (sao )?(os )?(lanches|itens|opcoes)',
  'me manda (o )?(cardapio|menu)', 'quero ver (o )?(cardapio|menu)', 'opcoes',
]
messages = []

[[intents]]
id = "price"
action = "reply"
fixed = true
when = "A pessoa pergunta o preço de um item ou quanto custa."
priority = "needed"
patterns = [
  'quanto (custa|e|sai|ta|fica)', 'qual (o |e o )?(preco|valor)', 'preco', 'valor',
  'ta quanto', 'quanto sai',
]
messages = ["Os preços estão no cardápio. Me diga o item que você quer que eu confirmo o valor."]

[[intents]]
id = "item_info"
action = "reply"
fixed = true
when = "A pessoa pergunta o que vem em um item, os ingredientes ou como ele é."
priority = "needed"
patterns = [
  'o que (e|vem|tem) (o |no |na )?', 'ingredientes', 'vem com (o que|que)',
  'como (e|que e) (o |a )?', 'esse item tem',
]
messages = ["Me diz qual item do cardápio você quer saber que eu te explico. 😊"]

[[intents]]
id = "hours"
action = "reply"
fixed = true
when = "A pessoa pergunta o horário de funcionamento ou se está aberto."
priority = "needed"
patterns = [
  'que horas (abre|fecha|funciona|voces abrem)', 'horario', 'abre (hoje|amanha|agora)',
  'fecha (hoje|amanha|que horas)', 'esta aberto', 'ta aberto', 'funciona (hoje|agora)',
  'voces estao abertos',
]
messages = ["Funcionamos todos os dias, das 18h às 23h. Pedidos para entrega até as 23h. 😊"]

[[intents]]
id = "address"
action = "reply"
fixed = true
when = "A pessoa pergunta o endereço, onde fica ou onde retira."
priority = "needed"
patterns = [
  'onde (fica|voces ficam|e voces|retira)', 'endereco', 'como chego', 'localizacao',
  'qual o local', 'retirar onde', 'retirada onde', 'posso buscar',
]
messages = [
  "Estamos na {address}. A retirada é no balcão, sem taxa. 😊",
]

[[intents]]
id = "delivery"
action = "reply"
fixed = true
when = "A pessoa pergunta sobre entrega, taxa, prazo, bairro ou pedido mínimo."
priority = "needed"
patterns = [
  'entregam', 'entrega', 'delivery', 'taxa de entrega', 'frete', 'levam',
  'pedido minimo', 'quanto tempo (demora|leva) para entregar', 'entregam no bairro',
]
messages = [
  "A entrega custa R$ 5,00. Pedidos acima de R$ 60,00 não pagam a taxa, e o pedido mínimo para entrega é R$ 15,00.",
  "O prazo médio é de 40 a 60 minutos. Entregamos em Cuiabá; bairros distantes podem ter o prazo confirmado pelo atendente.",
]

[[intents]]
id = "payment"
action = "reply"
fixed = true
when = "A pessoa pergunta as formas de pagamento, Pix, cartão, dinheiro ou troco."
priority = "needed"
patterns = [
  'paga(r)? (como|com|no|na)', 'pagamento', 'formas? de pagamento', 'aceita (pix|cartao|dinheiro)',
  'pix', 'cartao', 'dinheiro', 'debito', 'credito', 'troco', 'maquininha',
]
messages = [
  "Aceitamos Pix, dinheiro e cartão de débito ou crédito.",
  "No dinheiro, me diga para quanto precisa de troco. No Pix, o atendente envia a chave ao confirmar o pedido. No cartão, o pagamento é na entrega ou na retirada.",
]

[[intents]]
id = "no_order"
action = "close"
fixed = true
when = "A pessoa diz que não quer pedir nada agora, só está olhando ou pede para chamar depois."
priority = "needed"
patterns = [
  'nao quero (nada|pedir) (agora|hoje)?', 'so (estou )?olhando', 'depois eu peco',
  'agora nao', 'nao vou pedir', 'so vim ver',
]
messages = ["Tudo bem! Quando quiser, é só chamar por aqui. 😊"]

[[intents]]
id = "thanks"
action = "ignore"
fixed = true
when = "A pessoa agradece, diz ok ou valeu sem pedir mais nada."
priority = "needed"
patterns = ['obrigad', 'valeu', 'agradec', 'brigad', 'vlw']
messages = []

[[intents]]
id = "auto_reply"
action = "ignore"
fixed = true
when = "Resposta automática de outro número."
priority = "needed"
patterns = [
  'mensagem automatica', 'resposta automatica', 'no momento nao podemos atender',
  'fora do horario de atendimento', 'deixe sua mensagem',
]
messages = []

[[intents]]
id = "media"
action = "handoff"
fixed = true
when = "A pessoa manda foto, vídeo, documento ou áudio que o bot não conseguiu ler."
priority = "needed"
reason = "Cliente enviou mídia ou áudio que o bot não conseguiu ler"
patterns = ['^\[(imagem|video|documento|audio)\]$']
messages = ["Recebi seu arquivo! Vou pedir para o atendente dar uma olhada e já te respondo."]

[[intents]]
id = "unknown"
action = "reply"
fixed = true
when = "Nada acima se aplica."
priority = "needed"
patterns = []
messages = ["Desculpa, não entendi. Pode me dizer qual item do cardápio você quer e a quantidade? 😊"]
