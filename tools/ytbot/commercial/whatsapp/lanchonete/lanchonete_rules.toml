# Brasa & Pão WhatsApp ordering rules.
#
# Contract: docs/COMMERCIAL-WHATSAPP-LANCHONETE.md. This file is the only source of menu
# items, prices, extras, fees, payment methods, hours and promises. The model may only read
# free-form text and choose catalog ids; every price, total and reply is written here or
# calculated from here. Prices are integer cents to keep the arithmetic exact.
#
# Patterns are Python regular expressions matched against the incoming text after lowercasing,
# removing accents and collapsing spaces ("Quero 2 X-Bacon!" -> "quero 2 x bacon!").

version = 1
company = "Brasa & Pão"
tagline = "Lanches artesanais, feitos na hora"
agent_name = "Nina"
order_prefix = "BP"
language = "pt-BR"
timezone = "America/Cuiaba"
# Replace the address with the owner's real one before going live.
address = "Avenida das Acácias, 1280 — Jardim das Américas, Cuiabá/MT"

[limits]
max_replies_per_customer_per_day = 20  # stops loops with other bots; the owner takes over
max_bot_replies_before_owner = 15      # a long chat without a confirmed order goes to the owner
max_unknown = 2                        # two answers the bot did not understand: owner takes over
max_confirmations = 2                  # correction rounds on the order summary
max_messages_per_reply = 8             # the menu is sent in a few bubbles, links do not count
max_message_chars = 1200
max_qty_per_item = 10                  # a larger quantity goes to the owner
max_extras_per_item = 6
max_lines = 20                         # a larger order goes to the owner
max_order_cents = 30000                # a larger order goes to the owner
owner_reminder_minutes = 30            # one reminder per window for a chat with the owner
closed_notice_minutes = 60             # one closed notice per hour, not one per message

[hours]
# Weekday numbers: 0 = Monday ... 6 = Sunday. Times are local (America/Cuiaba).
ordering_days = [0, 1, 2, 3, 4, 5, 6]
ordering_start = "18:00"
ordering_end = "23:00"

[delivery]
fee_cents = 500
free_above_cents = 6000
min_order_cents = 1500
estimate = "40 a 60 minutos"
pickup_estimate = "20 a 30 minutos"
note = "Entregamos em Cuiabá. Bairros distantes podem ter o prazo confirmado pelo atendente."

[payment]
# No key is stored here: the attendant sends the Pix key when the order is confirmed.
[[payment.methods]]
id = "pix"
name = "Pix"
aliases = ["pix", "pix copia e cola", "transferencia"]
note = "O atendente envia a chave Pix ao confirmar o pedido."
change = false

[[payment.methods]]
id = "cash"
name = "Dinheiro"
aliases = ["dinheiro", "em especie", "nota", "cedula", "troco"]
note = "No dinheiro, informe para quanto precisa de troco."
change = true

[[payment.methods]]
id = "card"
name = "Cartão (débito ou crédito)"
aliases = ["cartao", "debito", "credito", "maquininha", "cartao de debito",
           "cartao de credito"]
note = "O cartão é passado na entrega ou na retirada."
change = false

[pacing]
typing_chars_per_second = 26.0
min_seconds = 1.5
max_seconds = 8.0
reading_chars_per_second = 45.0
reading_min_seconds = 1.0
reading_max_seconds = 3.0
jitter = 0.15
link_preview_seconds = 3.0
between_chats_min_seconds = 4.0
between_chats_max_seconds = 12.0

[llm]
# Reuses the sales model router: free models first, then the owner's paid fallback.
base_url = "https://opencode.ai/inference/go/openai/v1"
models_url = "https://opencode.ai/inference/go/v1/models"
api_key_env = "OPENCODE_GO_API_KEY"
fallback = ["deepseek-v4.1-flash", "muse-spark-1.3-contributor"]
exclude = []
temperature = 0.1
max_output_tokens = 1200
free_timeout_seconds = 12
timeout_seconds = 45
probe_timeout_seconds = 8
quick_timeout_seconds = 8
quick_attempts = 2
long_timeout_seconds = 30
long_max_output_tokens = 4096
long_race = 2
long_reasoning_effort = "low"
cooldown_seconds = 120
no_credit_cooldown_seconds = 1800
catalog_refresh_seconds = 3600

[greetings]
morning = "Bom dia"
afternoon = "Boa tarde"
evening = "Boa noite"

[context]
# Short answers are read against the question the bot just asked.
affirmative = [
  '^(sim|s|isso|isso mesmo|isso ai|exato|exatamente|certo|correto|perfeito|confirmo|pode|pode sim|pode ser|ok|okay|beleza|blz|fechado|fecha|manda|bora|vamo|quero|aceito|esta certo|ta certo|tudo certo|pode mandar|pode fechar)\b',
]
negative = ['^(nao|n|nop|negativo|errado|nao esta certo|nao e isso)\b']
# "Fechar o pedido" is the end of the item list, not a refusal.
done = [
  '^(so isso|e so isso|isso|por enquanto e isso|fechar|fecha|fechar o pedido|fecha o pedido|fechar pedido|pode fechar|pode fechar o pedido|pode confirmar|pode seguir|finalizar|encerrar|e isso|acabou|terminei|pronto|so esses|por enquanto so|nada mais|mais nada)\b',
]
cancel = [
  'cancela(r)? (o |meu )?pedido', 'desisti do pedido', 'nao quero mais (o )?pedido',
  'pode cancelar', 'deixa pra (outra|depois)',
]
change_exact = ['sem troco', 'nao preciso de troco', 'valor exato', 'tenho o valor exato',
                'pago o valor exato']

[facts]
empresa = [
  "A {company} é uma lanchonete de bairro: lanches artesanais, hot dogs, porções e sobremesas feitos na hora.",
  "O atendimento por este WhatsApp é feito pela {agent_name}, uma assistente virtual; o atendente acompanha as conversas e assume quando precisa.",
  "Endereço: {address}.",
]
horario = [
  "Funcionamos todos os dias, das 18h às 23h.",
  "Pedidos para entrega são aceitos até as 23h.",
]
entrega = [
  "A taxa de entrega é R$ 5,00.",
  "Pedidos de entrega acima de R$ 60,00 não pagam a taxa.",
  "O pedido mínimo para entrega é R$ 15,00.",
  "O prazo médio de entrega é de 40 a 60 minutos.",
  "Entregamos em Cuiabá; bairros distantes podem ter o prazo confirmado pelo atendente.",
]
retirada = [
  "A retirada é no balcão, na {address}.",
  "Não há taxa de retirada.",
  "O pedido fica pronto em 20 a 30 minutos.",
]
pagamento = [
  "Aceitamos Pix, dinheiro e cartão de débito ou crédito.",
  "No dinheiro, o cliente informa para quanto precisa de troco.",
  "No Pix, o atendente envia a chave ao confirmar o pedido.",
  "No cartão, o pagamento é feito na entrega ou na retirada.",
]
cardapio = [
  "O cardápio tem burgers artesanais, hot dogs, porções, combos, bebidas e sobremesas.",
  "Os itens podem receber adicionais pagos, como bacon, cheddar, queijo, ovo, maionese da casa, cebola caramelizada e catupiry.",
  "Cada adicional tem um valor próprio, informado no cardápio.",
]

[texts]
greeting = "{greeting}! Aqui é a {agent_name}, atendente virtual da {company}. 😊"
menu_intro = "Esse é o nosso cardápio:"
menu_question = "Me diga o que você quer e a quantidade. Se preferir, já pode mandar o pedido completo de uma vez."
closed = "{greeting}! Agora estamos fechados. Funcionamos todos os dias das 18h às 23h e aceitamos pedidos para entrega até as 23h. Fale comigo nesse horário que eu anoto seu pedido. 😊"
cart_empty = "Seu pedido está vazio. Me diga qual item do cardápio você quer e a quantidade."
cart_header = "Seu pedido até agora:"
cart_subtotal = "Subtotal: {subtotal}"
cart_question = "Quer mais alguma coisa ou posso fechar o pedido?"
ask_type = "O pedido é para entrega ou retirada?"
ask_address = "Qual o endereço completo da entrega? Inclua rua, número, bairro e um ponto de referência."
ask_name = "Qual o nome para o pedido?"
ask_payment = "Como você prefere pagar: Pix, dinheiro ou cartão (débito ou crédito)?"
ask_change = "Para quanto você precisa de troco? Se for pagar o valor exato, é só dizer \"sem troco\"."
summary_intro = "Confere seu pedido? 🧾"
summary_question = "Está tudo certo? Responda *SIM* para confirmar ou me diga o que quer ajustar."
confirmed_title = "Pedido confirmado! ✅"
confirmed_number = "Pedido *{number}* — {kind}."
confirmed_total = "Total: {total} — pagamento: {payment}."
confirmed_pix = "O atendente envia a chave Pix por aqui."
confirmed_delivery = "Tempo médio de entrega: {estimate}."
confirmed_pickup = "Retirada no balcão em {address}. Fica pronto em {estimate}."
confirmed_thanks = "Obrigado pela preferência! 😊"
cancelled = "Pedido cancelado. Se quiser começar de novo, é só me chamar. 😊"
cancelled_after_kitchen = "Seu pedido já foi enviado para a cozinha. Vou chamar o atendente para ajustar com você."
not_understood = "Desculpa, não entendi. Pode me dizer qual item do cardápio você quer e a quantidade? 😊"
ask_what_to_adjust = "O que você quer ajustar? Pode dizer, por exemplo: \"tira a coca\" ou \"troca para retirada\"."
swap_question = "Troco {fro} por {to}? Responde SIM para confirmar ou me diz o que prefere."
removed_item = "Tirei {item} do pedido."
below_min = "O pedido mínimo para entrega é R$ 15,00. Faltam {missing}. Você pode pedir mais alguma coisa ou escolher retirada, que não tem pedido mínimo."
below_min_question = "Quer adicionar mais alguma coisa ou prefere retirar no balcão?"
max_qty = "Consigo anotar até {max} unidades de cada item por pedido. Para uma quantidade maior, chamo o atendente."
max_order = "Esse pedido ficou maior do que o atendimento automático consegue fechar. Vou chamar o atendente para confirmar com você."
item_not_found = "Não encontrei esse item no cardápio. Me diga o nome como está no cardápio que eu anoto certinho."
extra_not_found = "Esse adicional não está no cardápio. Os adicionais disponíveis são: {extras}."
payment_unknown = "Não entendi a forma de pagamento. Pode escolher Pix, dinheiro ou cartão?"
change_too_low = "O total do pedido é {total}. Preciso de um valor maior para o troco, ou você pode pagar o valor exato."
handoff_ack = "Vou confirmar com o atendente e já te respondo por aqui."
correction_notice = "Olá! Para não restar dúvida, desconsidere o resumo anterior. Me diga como está seu pedido agora, com os itens e as quantidades, que eu anoto tudo certinho. 😊"
large_order = "Vou chamar o atendente para confirmar esse pedido maior com você."
owner_reason_unknown = "O cliente pediu algo que o bot não entendeu"
owner_reason_confirm = "O cliente não confirmou o resumo do pedido"
owner_reason_large = "Pedido acima do limite automático: confirme valores e prazo"
owner_reason_cancel = "Cliente quer cancelar um pedido que já foi confirmado"
owner_reason_status = "Cliente quer saber do pedido confirmado"
owner_reason_complaint = "Reclamação de pedido"
owner_reason_human = "Cliente pediu para falar com uma pessoa"
owner_reason_media = "Cliente enviou mídia ou áudio que o bot não conseguiu ler"

[guard]
# Terms the bot may never write (checked after removing accents). "sem taxa" is the delivery
# wording; the bot never says "gratis" or invents a discount.
forbidden = [
  "desconto", "cupom", "promocao", "promo", "gratis", "gratuito", "de graca",
  "brinde", "garantia", "garantimos", "reembolso garantido", "sem juros", "parcelamos",
  "senha", "cpf", "cnpj", "100%",
]
human_claims = [
  'sou (um |uma )?(humano|pessoa de verdade|pessoa real)',
  'nao sou (um |uma )?(robo|bot|ia|assistente)',
]

[context_rules]
# The same mandatory rules are repeated in context.md, the model's context file.
model_only_reads = true
never_invent_item = true
never_invent_price = true
confirm_before_kitchen = true
pix_key_only_from_owner = true

